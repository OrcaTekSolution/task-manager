
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Task Manager</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:0;
}
.header{
background:#0b1d51;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}
.header h2{
margin:0;
font-size:20px;
}
.add-btn{
background:#ffcc00;
border:none;
padding:10px 15px;
border-radius:20px;
font-weight:bold;
}
.container{
padding:10px;
}
.form-box{
display:none;
background:white;
padding:12px;
border-radius:12px;
margin-bottom:12px;
}
input, textarea, select{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}
.save-btn{
margin-top:10px;
background:#2563eb;
color:white;
border:none;
padding:12px;
width:100%;
border-radius:12px;
font-weight:bold;
}
.filters{
background:white;
padding:10px;
border-radius:12px;
margin-bottom:10px;
}
.filter-group{
display:flex;
flex-wrap:wrap;
gap:10px;
}
.task{
background:white;
padding:14px;
border-radius:14px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:flex-start;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
.task-left{
flex:1;
}
.task-title{
font-size:18px;
font-weight:bold;
}
.task-date{
font-size:12px;
color:#666;
margin-top:4px;
}
.priority{
display:inline-block;
margin-top:8px;
padding:4px 8px;
border-radius:8px;
font-size:11px;
font-weight:bold;
background:#ffe5e5;
color:#c00000;
}
.status{
display:inline-block;
margin-top:8px;
padding:4px 8px;
border-radius:8px;
font-size:11px;
font-weight:bold;
background:#fff1cc;
color:#cc7a00;
}
.task-note{
margin-top:10px;
font-size:14px;
}
.task-actions{
display:flex;
gap:10px;
margin-left:10px;
}
.icon-btn{
border:none;
background:none;
font-size:22px;
cursor:pointer;
}
.bottom-actions{
display:flex;
gap:10px;
position:sticky;
bottom:0;
background:#f2f2f2;
padding:10px;
}
.bottom-actions button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
color:white;
font-weight:bold;
}
.export{background:#16a34a;}
.import{background:#4b5563;}
.clear{background:#dc2626;}
</style>
</head>
<body>

<div class="header">
<h2>Daily Task Manager</h2>
<button class="add-btn" onclick="toggleForm()">+ Add Task</button>
</div>

<div class="container">

<div class="form-box" id="formBox">
<input type="hidden" id="editId">
<input type="text" id="title" placeholder="Task title">
<input type="date" id="date">
<select id="priority">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>
<select id="status">
<option>Pending</option>
<option>In Progress</option>
<option>On Hold</option>
<option>Completed</option>
</select>
<textarea id="note" placeholder="Task note"></textarea>
<button class="save-btn" onclick="saveTask()">Save Task</button>
</div>

<div class="filters">
<div class="filter-group">
<label><input type="checkbox" class="statusFilter" value="Pending" checked onchange="renderTasks()"> Pending</label>
<label><input type="checkbox" class="statusFilter" value="In Progress" checked onchange="renderTasks()"> In Progress</label>
<label><input type="checkbox" class="statusFilter" value="On Hold" checked onchange="renderTasks()"> On Hold</label>
<label><input type="checkbox" class="statusFilter" value="Completed" checked onchange="renderTasks()"> Completed</label>
</div>
</div>

<div id="taskList"></div>

<div class="bottom-actions">
<button class="export" onclick="exportTasks()">Export</button>
<button class="import" onclick="document.getElementById('importFile').click()">Import</button>
<button class="clear" onclick="clearAll()">Clear All</button>
<input type="file" id="importFile" style="display:none" onchange="importTasks(event)">
</div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function toggleForm(){
const box=document.getElementById("formBox");
box.style.display = box.style.display==="block" ? "none":"block";
}

function saveTask(){
const id=document.getElementById("editId").value || Date.now();

const task={
id:id,
title:document.getElementById("title").value,
date:document.getElementById("date").value,
priority:document.getElementById("priority").value,
status:document.getElementById("status").value,
note:document.getElementById("note").value
};

const existing=tasks.findIndex(t=>t.id==id);

if(existing>=0){
tasks[existing]=task;
}else{
tasks.push(task);
}

localStorage.setItem("tasks",JSON.stringify(tasks));

document.getElementById("editId").value="";
document.getElementById("title").value="";
document.getElementById("note").value="";

renderTasks();
toggleForm();
}

function renderTasks(){
const list=document.getElementById("taskList");
list.innerHTML="";

const selected=[...document.querySelectorAll(".statusFilter:checked")].map(e=>e.value);

const priorityOrder={"High":1,"Medium":2,"Low":3};

let filtered=tasks.filter(t=>selected.includes(t.status));

filtered.sort((a,b)=>priorityOrder[a.priority]-priorityOrder[b.priority]);

filtered.forEach(task=>{
list.innerHTML+=`
<div class="task">
<div class="task-left">
<div class="task-title">${task.title}</div>
<div class="task-date">Due: ${task.date}</div>
<div class="priority">${task.priority} Priority</div>
<div class="status">${task.status}</div>
<div class="task-note">${task.note}</div>
</div>

<div class="task-actions">
<button class="icon-btn" onclick="editTask(${task.id})">✏️</button>
<button class="icon-btn" onclick="deleteTask(${task.id})">🗑️</button>
</div>
</div>
`;
});
}

function editTask(id){
const task=tasks.find(t=>t.id==id);

document.getElementById("editId").value=task.id;
document.getElementById("title").value=task.title;
document.getElementById("date").value=task.date;
document.getElementById("priority").value=task.priority;
document.getElementById("status").value=task.status;
document.getElementById("note").value=task.note;

document.getElementById("formBox").style.display="block";
window.scrollTo({top:0,behavior:"smooth"});
}

function deleteTask(id){
tasks=tasks.filter(t=>t.id!=id);
localStorage.setItem("tasks",JSON.stringify(tasks));
renderTasks();
}

function clearAll(){
if(confirm("Clear all tasks?")){
tasks=[];
localStorage.setItem("tasks","[]");
renderTasks();
}
}

function exportTasks(){
const blob=new Blob([JSON.stringify(tasks)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="tasks-backup.json";
a.click();
}

function importTasks(event){
const file=event.target.files[0];
const reader=new FileReader();

reader.onload=function(e){
tasks=JSON.parse(e.target.result);
localStorage.setItem("tasks",JSON.stringify(tasks));
renderTasks();
}

reader.readAsText(file);
}

renderTasks();
</script>

</body>
</html>
